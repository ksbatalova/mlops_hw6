apiVersion: 1
groups:
  - orgId: 1
    name: fraud-scoring-alerts
    folder: Fraud alerts
    interval: 10s
    rules:
      - uid: fraud-ratio-high
        title: Высокая доля фрода
        condition: C
        for: 30s
        noDataState: OK
        execErrorState: Error
        annotations:
          summary: Доля фрода выше 5%
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: PBFA97CFB590B2093
            model: {refId: A, expr: fraud_ratio, instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
      - uid: stream-stopped
        title: Остановка потока транзакций
        condition: C
        for: 30s
        noDataState: Alerting
        execErrorState: Error
        annotations:
          summary: Скоринг почти не получает транзакций
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: PBFA97CFB590B2093
            model: {refId: A, expr: "rate(transactions_total[1m])", instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.1]}